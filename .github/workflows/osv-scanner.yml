name: OSV Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Generate lockfile
        run: |
          pip install --dry-run --report requirements.json .
          python -c "
          import json, pathlib
          report = json.loads(pathlib.Path('requirements.json').read_text())
          lines = []
          for pkg in report.get('install', []):
              m = pkg.get('metadata', {})
              if m.get('name', '').replace('_', '-').lower() == 'kube-lint-mcp':
                  continue
              lines.append(f'{m[\"name\"]}=={m[\"version\"]}')
          pathlib.Path('requirements.txt').write_text('\n'.join(sorted(lines)) + '\n')
          "

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always() && hashFiles('osv-results.sarif') != ''
        with:
          sarif_file: osv-results.sarif
